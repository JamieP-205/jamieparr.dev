<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Link-preview card</title>
<!-- The picture shown when the site is shared. Open this file in a browser, screenshot the #card element
     at 1200×630 and save it as public/og.png. Paths are relative so it works straight from disk. -->
<style>
  @font-face { font-family: 'Bricolage'; src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wdth-normal.woff2') format('woff2'); font-weight: 200 800; font-stretch: 75% 100%; }
  body { margin: 0; background: #888; }
  #card { position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; padding: 0 72px 64px; display: grid; align-content: end; background: #2947ec; color: #fff; font-family: 'Bricolage', sans-serif; }
  /* Same treatment as the homepage: the portrait runs off the right edge and fades into the cobalt on its left and top. */
  img { position: absolute; right: -70px; bottom: 0; width: 640px; height: 640px; -webkit-mask-image: linear-gradient(to right, transparent, #000 30%), linear-gradient(to bottom, transparent, #000 14%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent, #000 30%), linear-gradient(to bottom, transparent, #000 14%); mask-composite: intersect; }
  h1 { position: relative; margin: 0 0 30px -6px; font-size: 200px; font-weight: 620; font-stretch: 92%; letter-spacing: -0.035em; line-height: 0.86; }
  p { position: relative; margin: 0; font-size: 30px; line-height: 1.35; }
  .role { font-weight: 500; }
  .status { color: rgb(255 255 255 / 85%); }
  .status::before { content: ''; display: inline-block; width: 18px; height: 18px; margin-right: 14px; background: #ffd400; }
</style>
</head>
<body>
<div id="card">
  <img src="../public/uploads/jamie-parr-duotone-1200.webp" alt="">
  <h1>Jamie<br>Parr</h1>
  <p class="role">Computing student at Ulster University, Belfast.</p>
  <p class="status">Open to a 2027 placement</p>
</div>
</body>
</html>
