# Sveltia CMS: edits the files in /content and commits them to GitHub.
# Each save triggers a rebuild, so changes go live in about a minute.
backend:
  name: github
  repo: JamieP-205/jamie-parr-site
  branch: main
media_folder: public/uploads
public_folder: /uploads
site_url: /
collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: "One-line summary", widget: string }
      - { name: tech, label: "Tools used", widget: list, hint: "e.g. Python, Flask" }
      - { name: link, label: "Live site link", widget: string, required: false }
      - { name: repo, label: "Source code link", widget: string, required: false }
      - { name: image, label: "Screenshot (16:9)", widget: image, required: false }
      - { name: order, label: "Position (1 = first)", widget: number, value_type: int }
      - { name: draft, label: "Placeholder (shows as a dashed slot)", widget: boolean, default: false }
      - { name: body, label: "Write-up", widget: markdown }
  - name: pages
    label: Site
    files:
      - name: site
        label: "About & contact details"
        file: content/site.json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: headline, label: Headline, widget: text }
          - { name: availability, label: "Status line", widget: string }
          - { name: location, label: Location, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: github, label: "GitHub URL", widget: string }
          - { name: linkedin, label: "LinkedIn URL", widget: string }
          - { name: photo, label: Photo, widget: image }
          - { name: photoAlt, label: "Photo description (for screen readers)", widget: string }
          - { name: cv, label: "CV (PDF)", widget: file }
          - { name: about, label: About, widget: markdown }
          - { name: skills, label: Skills, widget: list }
      - name: cv
        label: "Education & work"
        file: content/cv.json
        fields:
          - name: education
            label: Education
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: org, label: "Where", widget: string }
              - { name: dates, label: Dates, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
          - name: work
            label: Work
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: org, label: "Where", widget: string }
              - { name: dates, label: Dates, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
