# Sveltia CMS: edits the files in /content.
# No GitHub repo is used. Open /admin locally (npx cf dev) in Chrome or Edge,
# choose "Work with Local Repository", pick this folder, edit, then deploy.
backend:
  name: github
  repo: JamieP-205/jamie-parr-site
  branch: main
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: "One-line summary", widget: string }
      - { name: proof, label: "Proof points", widget: list, required: false, hint: "Short facts shown on the homepage card (main case studies only)" }
      - { name: tech, label: "Tools used", widget: list, hint: "e.g. Python, Flask" }
      - name: links
        label: Links
        widget: list
        fields:
          - { name: label, label: "Button text", widget: string }
          - { name: url, label: URL, widget: string }
          - { name: primary, label: "Highlight this button", widget: boolean, default: false }
      - { name: image, label: "Screenshot (16:10)", widget: image, required: false }
      - { name: imageAlt, label: "Screenshot description", widget: string, required: false }
      - { name: featured, label: "Main case study (big layout)", widget: boolean, default: true }
      - { name: order, label: "Position (1 = first)", widget: number, value_type: int }
      - { name: draft, label: "Placeholder (shows as a dashed slot)", widget: boolean, default: false }
      - { name: body, label: "Write-up", widget: markdown }
  - name: pages
    label: Site
    files:
      - name: site
        label: "About & contact details"
        file: content/site.json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: headline, label: Headline, widget: text }
          - { name: availability, label: "Status line", widget: string }
          - name: lookingFor
            label: "What I'm looking for (strip under the intro)"
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: github, label: "GitHub URL", widget: string }
          - { name: linkedin, label: "LinkedIn URL", widget: string }
          - { name: photo, label: Photo, widget: image }
          - { name: photoAlt, label: "Photo description (for screen readers)", widget: string }
          - { name: cv, label: "CV (PDF)", widget: file }
          - { name: about, label: About, widget: markdown }
          - { name: skills, label: Skills, widget: list }
      - name: cv
        label: "Education & work"
        file: content/cv.json
        fields:
          - name: education
            label: Education
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: org, label: "Where", widget: string }
              - { name: dates, label: Dates, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
          - name: work
            label: Work
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: org, label: "Where", widget: string }
              - { name: dates, label: Dates, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
